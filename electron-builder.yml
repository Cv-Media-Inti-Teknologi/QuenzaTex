appId: com.quenzatex.app
productName: Quenzatex
directories:
  buildResources: resources
  output: dist-electron
files:
  - out/**/*
win:
  target:
    - nsis
  icon: resources/icon.ico
mac:
  target:
    - dmg
  icon: resources/icon.icns
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
