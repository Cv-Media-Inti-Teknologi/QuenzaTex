appId: com.quenzatex.app
productName: QuenzaTex
directories:
  buildResources: resources
  output: dist-electron
files:
  - out/**/*
win:
  target:
    - nsis
  icon: resources/icon.ico
mac:
  target:
    - dmg
  icon: resources/icon.icns
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  maintainer: CV Media Inti Teknologi <admin@gomit.id>
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: Cv-Media-Inti-Teknologi
  repo: QuenzaTex
